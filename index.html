<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mix List</title>
<meta name="theme-color" content="#f7f7f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mix List">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* base reset */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
.pinmsg{margin:0;color:var(--mute);font-size:13px}
/* Layout: monochrome mixer — one hairline-divided list, ink as the only strong color; small semantic dots for status */
:root{
  --bg:#f7f7f6; --panel:#ffffff; --ink:#111111; --mute:#7a7a78; --faint:#b9b9b6; --line:#e6e6e3;
  --pad:#ececea; --on:#111111; --on-fg:#ffffff;
  --ok:#2e8b57; --warn:#c2852b; --blue:#3a6fd8; --violet:#7b5cd6;
  --f-display:"Manrope","Noto Sans JP",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Manrope","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111111; --panel:#181818; --ink:#f2f2f0; --mute:#8f8f8c; --faint:#555553; --line:#2a2a29;
  --pad:#242423; --on:#f2f2f0; --on-fg:#111111;
  --ok:#5cc28a; --warn:#e0a650; --blue:#7fa5ff; --violet:#a891ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --panel:#181818; --ink:#f2f2f0; --mute:#8f8f8c; --faint:#555553; --line:#2a2a29;
  --pad:#242423; --on:#f2f2f0; --on-fg:#111111;
  --ok:#5cc28a; --warn:#e0a650; --blue:#7fa5ff; --violet:#a891ff; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 104px;display:flex;flex-direction:column;gap:28px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

header{display:flex;flex-direction:column;gap:4px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,32px);line-height:1;letter-spacing:.02em;margin:0;color:var(--ink)}
h1 span{color:inherit}
.sub{color:var(--mute);font-size:12px;letter-spacing:.04em}

/* summary */
.deck{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:end;padding-bottom:28px;border-bottom:1px solid var(--line)}
@media (max-width:560px){.deck{grid-template-columns:1fr}}
.stats{display:flex;flex-direction:column;gap:18px}
.statrow{display:flex;gap:32px}
.stat .k{font-size:11px;letter-spacing:.1em;color:var(--mute)}
.stat .v{font-family:var(--f-display);font-weight:500;font-size:40px;line-height:1.05;letter-spacing:-.02em}
.statrow .stat .v{font-size:24px}
.stat .v small{font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--mute);margin-left:4px;letter-spacing:0}
.padhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.padhead b{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em}
.padhead .nav{display:flex;gap:4px;align-items:center}
.padhead .nav button{border:1px solid var(--line);background:transparent;border-radius:999px;min-width:28px;height:28px;padding:0 8px;font-size:14px;line-height:1;color:var(--mute)}
.padhead .nav button:hover{color:var(--ink);border-color:var(--ink)}
.padhead .nav .tm{font-size:11px}
.pad.blank{background:transparent}
.pad.first{color:var(--ink);font-weight:500}
.pad.on.first{color:var(--on-fg)}
.pads{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.pads .dow{font-size:10px;text-align:center;color:var(--faint);font-family:var(--f-mono)}
.pad{aspect-ratio:1;max-width:100%;border-radius:4px;background:var(--pad);display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 4px;font-family:var(--f-mono);font-size:9px;color:var(--faint);position:relative}
.pad.on{background:var(--on);color:var(--on-fg)}
.pad.on.multi::after{content:"";position:absolute;top:4px;left:4px;width:4px;height:4px;border-radius:50%;background:var(--on-fg)}
.pad.plan{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}
.pad.today{box-shadow:inset 0 0 0 1px var(--ink),0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.pad.future{opacity:.5}
.legend{display:flex;gap:14px;font-size:10px;color:var(--mute);margin-top:10px;flex-wrap:wrap;letter-spacing:.04em}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;vertical-align:0;margin-right:5px;background:var(--pad)}
.legend i.on{background:var(--on)} .legend i.plan{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}

/* tabs */
.tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:-28px}
.tab{border:0;background:none;padding:0 0 10px;font-size:13px;color:var(--mute);white-space:nowrap;display:flex;gap:6px;align-items:baseline;border-bottom:1.5px solid transparent;margin-bottom:-1px}
.tab .c{font-family:var(--f-mono);font-size:10px;color:var(--faint)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab[aria-selected="true"] .c{color:var(--mute)}

/* list */
.list{display:flex;flex-direction:column}
.card{padding:18px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:start}
.card .mix{min-width:0;display:flex;flex-direction:column;gap:3px}
.track{display:flex;gap:10px;align-items:baseline;min-width:0;flex-wrap:wrap}
.track .ch{font-family:var(--f-mono);font-size:10px;color:var(--faint);width:10px;flex:none}
.track .t{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.track .ar{color:var(--mute);font-size:12px;overflow-wrap:anywhere}
.track .meta{font-family:var(--f-mono);font-size:10px;color:var(--mute)}
.catrow{grid-column:1/-1;display:flex;flex-direction:column;gap:5px;min-width:0}
.catrow>label{font-size:11px;color:var(--mute);letter-spacing:.03em}
.cands{display:flex;gap:6px;flex-wrap:wrap}
.cands:empty{display:none}
.cand{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:11px;color:var(--mute)}
.cand:hover{color:var(--ink);border-color:var(--ink)}
.cand[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.catin{display:flex;gap:8px;align-items:center}
.catin input{flex:1}
.catin .btn-s{white-space:nowrap}
.cats{display:flex;gap:8px;overflow-x:auto;margin-top:14px;margin-bottom:-14px;padding-bottom:2px}
.cat{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--mute);white-space:nowrap}
.cat:hover{color:var(--ink);border-color:var(--ink)}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.catlabel{display:inline-block;font-size:10px;letter-spacing:.06em;border:1px solid var(--ink);color:var(--ink);border-radius:999px;padding:0 8px;margin-bottom:4px;align-self:flex-start}
.mtitle{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.chips{grid-column:1/-1;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;padding-left:20px}
.chip{font-size:11px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--faint)}
.chip.match::before{background:var(--ink)}
.chip.clash::before{background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}

.chip.sample{font-style:italic}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.st{font-size:11px;letter-spacing:.06em;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid var(--faint)}
.seg{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:4px 11px;font-size:11px;color:var(--mute);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg button::before{content:"";width:6px;height:6px;border-radius:50%;background:transparent;box-shadow:inset 0 0 0 1px var(--ink)}
.seg .s-ready::before{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)} .seg .s-posted::before{background:var(--ink)}
.seg button[aria-pressed="true"]::before{box-shadow:inset 0 0 0 1px var(--bg)}
.seg .s-ready[aria-pressed="true"]::before{background:linear-gradient(90deg,var(--bg) 50%,transparent 50%)} .seg .s-posted[aria-pressed="true"]::before{background:var(--bg)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .arrow{color:var(--faint);font-size:11px}
.sidebot{display:flex;gap:10px;align-items:center}
@media (max-width:520px){.card{grid-template-columns:1fr}.side{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}.chips{padding-left:20px}}
.side .date{font-family:var(--f-mono);font-size:10px;color:var(--mute)}
.btn-s{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:11px;color:var(--mute)}
.btn-s:hover{color:var(--ink);border-color:var(--ink)}
.btn-s.go{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.empty{padding:40px 0;text-align:center;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line)}
.notice{font-size:12px;color:var(--warn)}

.fab{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 20px));bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:13px 22px;font-size:13px;font-weight:500;letter-spacing:.04em;box-shadow:0 10px 30px -12px rgba(0,0,0,.45);display:flex;gap:8px;align-items:center}

dialog{border:0;border-radius:16px;background:var(--panel);color:var(--ink);padding:0;width:min(600px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(2px)}
form.sheet{display:flex;flex-direction:column;gap:18px;padding:24px}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;letter-spacing:.02em}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
legend{float:left;width:100%;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--mute);margin-bottom:2px;padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:440px){fieldset,.grid2{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--mute);min-width:0;letter-spacing:.03em}
label.full{grid-column:1/-1}
input,select,textarea{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:6px 0;font-size:15px;color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:0;border-bottom-color:var(--ink)}
select{background:var(--panel)}
textarea{min-height:56px;resize:vertical}
.checks{display:flex;gap:18px;flex-wrap:wrap}
.checks label{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.checks input{width:auto;accent-color:var(--ink)}
.decks{display:flex;flex-direction:column;gap:18px}
.dhead{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dhead .lt{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:var(--mute)}
.dhead .tools{display:flex;gap:6px;align-items:center}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);border-radius:999px;padding:3px 12px;font-size:11px;color:var(--ink);cursor:pointer;flex-direction:row;letter-spacing:0}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;border:0;padding:0}
.filebtn:focus-within{outline:2px solid var(--ink);outline-offset:2px}
.rm{border:0;background:none;color:var(--mute);font-size:16px;line-height:1;padding:2px 6px;border-radius:999px}
.rm:hover{color:var(--ink)}
.det{grid-column:1/-1;font-family:var(--f-mono);font-size:10px;color:var(--mute);min-height:0}
.det:empty{display:none}
.det.busy::before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;border:1.5px solid var(--ink);border-right-color:transparent;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.addDeck{align-self:flex-start}
.live{font-size:11px;font-family:var(--f-mono);color:var(--mute);min-height:1em;white-space:pre-line}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center;padding-top:6px}
.actions .r{display:flex;gap:8px;margin-left:auto}
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 20px;font-size:13px}
.btn.p{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.d{color:var(--mute);border-color:transparent;padding-inline:0;text-decoration:underline;text-underline-offset:3px}
.confirm{font-size:12px;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Mix List</h1>
    </div>
  </header>

  <section class="deck" aria-label="投稿状況">
    <div class="stats">
      <div class="stat"><div class="k">連続投稿</div><div class="v mono" id="sStreak">0<small>日</small></div></div>
      <div class="statrow">
        <div class="stat"><div class="k">投稿ストック</div><div class="v mono" id="sStock">0<small>本</small></div></div>
        <div class="stat"><div class="k">今月の投稿</div><div class="v mono" id="sMonth">0<small>本</small></div></div>
      </div>
    </div>
    <div>
      <div class="padhead" id="padHead"></div>
      <div class="pads" id="pads"></div>
      <div class="legend"><span><i class="on"></i>投稿済み</span><span><i class="plan"></i>投稿予定</span><span><i></i>空き</span></div>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="cats" id="cats" role="group" aria-label="カテゴリーで絞り込み" hidden></div>
  <div class="notice" id="notice" hidden></div>
  <div class="list" id="list"></div>
</div>

<button class="fab" type="button" id="addBtn"><span aria-hidden="true">＋</span>追加</button>

<dialog id="dlg">
  <form class="sheet" id="form" method="dialog">
    <h2 id="fTitle">New Mix</h2>
    <div class="decks" id="decks"></div>
    <button type="button" class="btn-s addDeck" id="addDeck">＋ 曲を追加</button>
    <div class="live" id="liveMatch"></div>
    <div class="grid2">
      <label class="full">Mix名（任意）<input id="mT" autocomplete="off"></label>
      <div class="full catrow"><label for="cat">カテゴリー（ジャンルなど・DECK A の曲で判定）</label>
        <div class="catin"><input id="cat" list="catList" autocomplete="off" placeholder="空欄なら保存時に自動で判定（例：Future Bass、City Pop）"><button type="button" class="btn-s go" id="aiCat">ジャンルを判定</button></div>
        <div class="det" id="aiMsg" role="status"></div><div class="cands" id="cands"></div></div>
      <datalist id="catList"></datalist>
      <label>ステータス<select id="st">
        <option value="idea">アイデア</option><option value="ready">完成</option><option value="posted">投稿済み</option></select></label>
      <label>投稿日（予定・実績）<input id="pd" type="date"></label>
    </div>
    <label class="full">メモ<textarea id="memo" placeholder="使うパート、フック、撮影メモなど"></textarea></label>
    <div class="actions">
      <div id="delWrap"></div>
      <div class="r">
        <button type="button" class="btn" id="cancel">閉じる</button>
        <button type="submit" class="btn p" id="save">保存</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="pinDlg">
  <form class="sheet" id="pinForm" method="dialog">
    <h2>Mix List</h2>
    <p class="pinmsg" id="pinMsg">PINを入力してください。</p>
    <label class="full">PIN<input id="pinIn" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <div class="actions"><div class="r"><button type="submit" class="btn p">開く</button></div></div>
  </form>
</dialog>


<script src="/analyze.js" defer></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const STATUS={idea:"アイデア",ready:"完成",posted:"投稿済み"};
const FLOW=["idea","ready","posted"];
const norm=st=>st==="making"?"idea":(STATUS[st]?st:"idea");
const TABS=[["all","すべて"],["idea","アイデア"],["ready","完成"],["posted","投稿済み"]];
const KEYS=[];for(let n=1;n<=12;n++){KEYS.push(n+"A",n+"B")}
const KEYNAME={"1A":"A♭m","1B":"B","2A":"E♭m","2B":"F♯","3A":"B♭m","3B":"D♭","4A":"Fm","4B":"A♭","5A":"Cm","5B":"E♭","6A":"Gm","6B":"B♭","7A":"Dm","7B":"F","8A":"Am","8B":"C","9A":"Em","9B":"G","10A":"Bm","10B":"D","11A":"F♯m","11B":"A","12A":"D♭m","12B":"E"};

let view=new Date(new Date().getFullYear(),new Date().getMonth(),1), tracks=[], tab="all", db=null, editing=null, local=false;
let cat="";
try{tab=localStorage.getItem("ml-tab")||"all";cat=localStorage.getItem("ml-cat")||""}catch(e){}
const PRESET_CATS=["Future Bass","Tech House","Deep House","Progressive House","UK Garage","Drum & Bass","Dubstep","Trap","Drill","Phonk","Jersey Club","Amapiano","Afrobeats","Reggaeton","City Pop","Lo-fi Hip Hop","Boom Bap","Hyperpop","Synth-Pop","アニソン","ボカロ"];
const catsUsed=()=>[...new Set(tracks.map(t=>(t.category||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"ja"));

/* ---------- helpers ---------- */
const pad2=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
const todayStr=()=>ymd(new Date());
const fmtMD=s=>{if(!s)return"";const[,m,d]=s.split("-");return(+m)+"/"+(+d)};
function camelot(a,b){
  if(!a||!b)return null;
  const na=parseInt(a),nb=parseInt(b),la=a.slice(-1),lb=b.slice(-1);
  const step=Math.min((na-nb+12)%12,(nb-na+12)%12);
  if(a===b)return{ok:true,txt:"同じキー"};
  if(la===lb&&step===1)return{ok:true,txt:"隣接キー"};
  if(na===nb&&la!==lb)return{ok:true,txt:"平行調"};
  if(la===lb&&step===2)return{ok:false,txt:"2つ離れ・要注意"};
  return{ok:false,txt:"キー衝突"};
}
function bpmGap(a,b){a=+a;b=+b;if(!a||!b)return null;
  // consider half/double time
  const c=[b,b*2,b/2].map(x=>Math.abs(a-x)/Math.min(a,x)*100);return Math.min(...c)}
function el(tag,attrs,...kids){const e=document.createElement(tag);for(const k in attrs||{}){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e.addEventListener(k.slice(2),attrs[k]);else e.setAttribute(k,attrs[k])}for(const c of kids){if(c==null||c===false)continue;e.append(c.nodeType?c:String(c))}return e}

/* ---------- render ---------- */
function render(){renderStats();renderTabs();renderList()}

function postedDates(){const m={};for(const t of tracks){if(t.status==="posted"&&t.postDate)m[t.postDate]=(m[t.postDate]||0)+1}return m}
function plannedDates(){const s=new Set();for(const t of tracks){if(t.status!=="posted"&&t.postDate)s.add(t.postDate)}return s}

function renderStats(){
  const posted=postedDates(),planned=plannedDates(),today=new Date();
  // streak
  let d=new Date(today);if(!posted[ymd(d)])d.setDate(d.getDate()-1);
  let streak=0;while(posted[ymd(d)]){streak++;d.setDate(d.getDate()-1)}
  $("sStreak").firstChild.nodeValue=streak;
  $("sStock").firstChild.nodeValue=tracks.filter(t=>t.status==="ready").length;
  const ym=ymd(today).slice(0,7);
  $("sMonth").firstChild.nodeValue=tracks.filter(t=>t.status==="posted"&&(t.postDate||"").startsWith(ym)).length;
  // one month calendar (Sun-start)
  const pads=$("pads");pads.textContent="";
  "日月火水木金土".split("").forEach(w=>pads.append(el("div",{class:"dow"},w)));
  const vy=view.getFullYear(),vm=view.getMonth();
  const ts=todayStr();
  const ph=$("padHead");ph.textContent="";
  const isCur=vy===today.getFullYear()&&vm===today.getMonth();
  ph.append(el("b",{},vy+"年 "+(vm+1)+"月"),el("div",{class:"nav"},
    el("button",{type:"button","aria-label":"前の月",onclick:()=>{view=new Date(vy,vm-1,1);renderStats()}},"‹"),
    isCur?null:el("button",{type:"button",class:"tm",onclick:()=>{view=new Date(today.getFullYear(),today.getMonth(),1);renderStats()}},"今月"),
    el("button",{type:"button","aria-label":"次の月",onclick:()=>{view=new Date(vy,vm+1,1);renderStats()}},"›")));
  const lead=new Date(vy,vm,1).getDay(),days=new Date(vy,vm+1,0).getDate();
  for(let i=0;i<lead;i++)pads.append(el("div",{class:"pad blank","aria-hidden":"true"}));
  for(let dd=1;dd<=days;dd++){
    const k=vy+"-"+pad2(vm+1)+"-"+pad2(dd);
    const cls=["pad"];if(posted[k])cls.push("on");if(posted[k]>1)cls.push("multi");
    if(!posted[k]&&planned.has(k))cls.push("plan");if(k===ts)cls.push("today");if(k>ts)cls.push("future");
    pads.append(el("div",{class:cls.join(" "),title:k+(posted[k]?"・投稿 "+posted[k]+"本":planned.has(k)?"・投稿予定":"")},dd));
  }
}


function renderCats(){
  const box=$("cats"),used=catsUsed();box.textContent="";
  if(cat&&!used.includes(cat))cat="";
  box.hidden=!used.length;if(!used.length)return;
  const set=c=>{cat=c;try{localStorage.setItem("ml-cat",c)}catch(e){}render()};
  box.append(el("button",{type:"button",class:"cat","aria-pressed":String(!cat),onclick:()=>set("")},"すべてのカテゴリー"));
  for(const c of used)box.append(el("button",{type:"button",class:"cat","aria-pressed":String(cat===c),onclick:()=>set(cat===c?"":c)},c));
}
function renderTabs(){
  renderCats();
  const nav=$("tabs");nav.textContent="";
  for(const[k,label]of TABS){
    const c=k==="all"?tracks.length:tracks.filter(t=>t.status===k).length;
    nav.append(el("button",{class:"tab",role:"tab","aria-selected":String(tab===k),type:"button",onclick:()=>{tab=k;try{localStorage.setItem("ml-tab",k)}catch(e){}render()}},label,el("span",{class:"c mono"},c)));
  }
}

function sortKey(t){
  const order={ready:0,idea:1,posted:2}[t.status]??3;
  return [order,t.status==="posted"?-(Date.parse(t.postDate||0)||0):(t.postDate?Date.parse(t.postDate):9e15)];
}
function renderList(){
  const list=$("list");list.textContent="";
  let items=tab==="all"?tracks.slice():tracks.filter(t=>t.status===tab);
  if(cat)items=items.filter(t=>(t.category||"")===cat);
  items.sort((a,b)=>{const x=sortKey(a),y=sortKey(b);return x[0]-y[0]||x[1]-y[1]});
  if(!items.length){
    list.append(el("div",{class:"empty"},tracks.length?"このステータスの曲はまだありません。":"まだ曲がありません。右下の「追加」から、Mixする曲を登録してください。"));
    return;
  }
  for(const t of items)list.append(card(t));
}
function trackRow(side,x){
  x=x||{};const meta=[x.bpm?x.bpm+" BPM":"",x.key?x.key+(KEYNAME[x.key]?" ("+KEYNAME[x.key]+")":""):""].filter(Boolean).join(" · ");
  return el("div",{class:"track "+side},el("span",{class:"ch"},side.toUpperCase()),el("span",{class:"t"},x.title||"未入力"),x.artist?el("span",{class:"ar"},x.artist):null,meta?el("span",{class:"meta"},meta):null);
}
const LET="ABCDEFGH";
function decksOf(t){return Array.isArray(t.decks)&&t.decks.length?t.decks:[t.a,t.b].filter(Boolean)}
// 1曲目（A）と各曲の相性をまとめる
function compat(ds){
  const base=ds[0]||{},keys=[],gaps=[];
  ds.slice(1).forEach((d,i)=>{const L=LET[i+1];const km=camelot(base.key,d.key);if(km)keys.push({L,...km});const g=bpmGap(base.bpm,d.bpm);if(g!=null)gaps.push({L,g})});
  return{keys,gaps};
}
function card(t){
  const ds=decksOf(t),cp=compat(ds);
  const chips=el("div",{class:"chips"});
  if(t.sample)chips.append(el("span",{class:"chip sample"},"サンプル"));
  if(cp.keys.length){
    const bad=cp.keys.filter(k=>!k.ok);
    const txt=ds.length===2?cp.keys[0].txt:bad.length?bad.map(k=>"A×"+k.L+" "+k.txt).join(" / "):"キー相性OK";
    chips.append(el("span",{class:"chip "+(bad.length?"clash":"match")},txt));
  }
  if(cp.gaps.length){
    const mx=Math.max(...cp.gaps.map(x=>x.g));
    chips.append(el("span",{class:"chip mono "+(mx<=6?"match":"clash")},(ds.length>2?"BPM差 最大 ":"BPM差 ")+mx.toFixed(1)+"%"));
  }
  if(t.memo)chips.append(el("span",{class:"chip",title:t.memo},t.memo.length>24?t.memo.slice(0,24)+"…":t.memo));
  const seg=el("div",{class:"seg",role:"group","aria-label":"ステータス"});
  FLOW.forEach((k,i)=>{
    if(i)seg.append(el("span",{class:"arrow","aria-hidden":"true"},"›"));
    seg.append(el("button",{type:"button",class:"s-"+k,"aria-pressed":String(t.status===k),onclick:()=>{if(t.status!==k)setStatus(t,k)}},STATUS[k]));
  });
  const side=el("div",{class:"side"},seg,
    el("div",{class:"sidebot"},
      t.postDate?el("span",{class:"date"},(t.status==="posted"?"投稿 ":"予定 ")+fmtMD(t.postDate)):null,
      el("button",{type:"button",class:"btn-s",onclick:()=>openForm(t)},"編集")));
  return el("article",{class:"card"},el("div",{class:"mix"},t.category?el("span",{class:"catlabel"},t.category):null,t.title?el("div",{class:"mtitle"},t.title):null,...ds.map((d,i)=>trackRow(LET[i].toLowerCase(),d))),side,chips);
}

/* ---------- data (Vercel API + Upstash Redis) ---------- */
let pin="";try{pin=localStorage.getItem("ml-pin")||""}catch(e){}
function cache(){try{localStorage.setItem("ml-cache",JSON.stringify(tracks))}catch(e){}}
async function api(action,payload){
  let r;
  try{r=await fetch("/api/mix",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,pin,...(payload||{})})})}
  catch(e){throw{code:"offline"}}
  const j=await r.json().catch(()=>({}));
  if(r.status===401){askPin(!!pin);throw{code:"pin"}}
  if(!r.ok)throw{code:"server",message:j.error};
  return j;
}
function stripId(t){const o={...t};delete o.id;return o}
let loading=false;
async function load(){
  if(loading)return;loading=true;
  try{const j=await api("list");tracks=(j.tracks||[]).map(o=>({...o,status:norm(o.status)}));cache();hideNotice();render()}
  catch(e){if(e.code!=="pin")showNotice(e)}
  finally{loading=false}
}
function put(t){t={...t,status:norm(t.status)};const i=tracks.findIndex(x=>x.id===t.id);if(i>=0)tracks[i]=t;else tracks.push(t);cache();render()}
async function saveTrack(id,data){const j=await api("save",{id,data});put(j.track)}
async function removeTrack(id){await api("delete",{id});tracks=tracks.filter(t=>t.id!==id);cache();render()}
async function setStatus(t,ns){
  const data=stripId(t);data.status=ns;
  if(ns==="posted"&&(!t.postDate||t.postDate>todayStr()))data.postDate=todayStr();
  put({...data,id:t.id});
  try{await saveTrack(t.id,data)}catch(e){if(e.code!=="pin")showNotice(e);load()}
}
function hideNotice(){$("notice").hidden=true}
function showNotice(e){const n=$("notice");n.hidden=false;
  n.textContent=e&&e.code==="offline"?"オフラインです。電波のある場所でもう一度開いてください（表示は前回の内容です）。":
    (e&&e.message)||"保存できませんでした。通信状況を確認して、もう一度お試しください。";}
function askPin(wrong){
  const d=$("pinDlg");if(d.open)return;
  $("pinMsg").textContent=wrong?"PINが違います。もう一度入力してください。":"PINを入力してください。";
  $("pinIn").value="";d.showModal();
}
$("pinForm").addEventListener("submit",e=>{e.preventDefault();pin=$("pinIn").value.trim();try{localStorage.setItem("ml-pin",pin)}catch(x){}$("pinDlg").close();load()});
$("pinDlg").addEventListener("cancel",e=>e.preventDefault());

/* ---------- form ---------- */
function fillKeys(sel){sel.append(el("option",{value:""},"—"));for(const k of KEYS)sel.append(el("option",{value:k},k+"  "+KEYNAME[k]))}
const MAXD=8;
function deckBlock(d,i){
  d=d||{};
  const fs=el("fieldset",{class:"deckf"});
  const file=el("input",{type:"file",accept:"audio/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.aif,.aiff","aria-label":"音源ファイルを選んでBPMとキーを検出"});
  const tools=el("div",{class:"tools"},el("label",{class:"filebtn"},"♪ 音源から検出",file));
  if(i>=2)tools.append(el("button",{type:"button",class:"rm","aria-label":"この曲を外す",onclick:()=>{fs.remove();relabel();updateLive()}},"×"));
  fs.append(el("div",{class:"dhead"},el("span",{class:"lt"},"DECK "+LET[i]),tools));
  const T=el("input",{class:"dT",autocomplete:"off"});T.value=d.title||"";if(i<2)T.required=true;
  const R=el("input",{class:"dR",autocomplete:"off"});R.value=d.artist||"";
  const B=el("input",{class:"dB",type:"number",inputmode:"decimal",min:"40",max:"220",step:"0.1"});B.value=d.bpm||"";
  const K=el("select",{class:"dK"});fillKeys(K);K.value=d.key||"";
  const det=el("div",{class:"det",role:"status"});
  fs.append(el("label",{class:"full"},"曲名",T),el("label",{class:"full"},"アーティスト",R),el("label",{},"BPM",B),el("label",{},"キー（Camelot）",K),det);
  B.addEventListener("input",updateLive);K.addEventListener("input",updateLive);
  file.addEventListener("change",()=>{const f=file.files&&file.files[0];file.value="";if(f)detect(f,{T,R,B,K,det})});
  return fs;
}
function relabel(){
  const fs=[...$("decks").children];
  fs.forEach((f,i)=>{f.querySelector(".lt").textContent="DECK "+LET[i]});
  $("addDeck").hidden=fs.length>=MAXD;
}
function readDecks(){
  const num=v=>v===""?null:+v;
  return [...$("decks").children].map(f=>({title:f.querySelector(".dT").value.trim(),artist:f.querySelector(".dR").value.trim(),bpm:num(f.querySelector(".dB").value),key:f.querySelector(".dK").value}))
    .filter((d,i)=>i<2||d.title||d.artist||d.bpm||d.key);
}
// 解析は1曲ずつ順番に行う（重い処理が重ならないように）
let queue=Promise.resolve();
function detect(f,x){
  const name=window.MixAnalyze?MixAnalyze.fromFilename(f.name):{title:"",artist:""};
  if(!x.T.value&&name.title)x.T.value=name.title;
  if(!x.R.value&&name.artist)x.R.value=name.artist;
  x.det.className="det busy";x.det.textContent="待機中… "+f.name;
  queue=queue.then(async()=>{
    try{
      if(!window.MixAnalyze)throw new Error("解析エンジンを読み込めませんでした");
      const r=await MixAnalyze.analyze(f,step=>{x.det.textContent=step+"… "+f.name});
      if(r.bpm)x.B.value=r.bpm;
      if(r.key)x.K.value=r.key;
      x.det.className="det";
      x.det.textContent="検出: "+[r.bpm?r.bpm+" BPM":"BPM 不明",r.key?r.key+"（"+r.keyName+"）":"キー 不明"].join(" · ")+(r.strength&&r.strength<0.5?"（キーは参考値）":"");
      updateLive();
    }catch(e){x.det.className="det";x.det.textContent=(e&&e.message)||"解析できませんでした"}
  });
}
function updateLive(){
  const ds=readDecks(),cp=compat(ds),lines=[];
  ds.slice(1).forEach((d,i)=>{
    const L=LET[i+1],k=cp.keys.find(x=>x.L===L),g=cp.gaps.find(x=>x.L===L),parts=[];
    if(k)parts.push("キー "+k.txt+(k.ok?" ✓":" !"));
    if(g)parts.push("BPM差 "+g.g.toFixed(1)+"%"+(g.g<=6?" ✓":" (テンポ調整大)"));
    if(parts.length)lines.push("A×"+L+"  "+parts.join("  "));
  });
  $("liveMatch").textContent=lines.join("\n");
}
$("addDeck").addEventListener("click",()=>{const n=$("decks").children.length;if(n>=MAXD)return;$("decks").append(deckBlock({},n));relabel();$("decks").lastChild.querySelector(".dT").focus()});
function openForm(t){
  editing=t||null;
  $("fTitle").textContent=t?"Mixを編集":"New Mix";
  const ds=t?decksOf(t):[];while(ds.length<2)ds.push({});
  const box=$("decks");box.textContent="";ds.forEach((d,i)=>box.append(deckBlock(d,i)));relabel();
  $("aiMsg").textContent="";$("aiMsg").className="det";$("cands").textContent="";
  $("mT").value=t?.title||"";$("cat").value=t?t.category||"":(cat||"");
  const dl=$("catList");dl.textContent="";[...new Set([...catsUsed(),...PRESET_CATS])].forEach(c=>dl.append(el("option",{value:c})));
  $("st").value=t?.status||"idea";$("pd").value=t?.postDate||"";
  $("memo").value=t?.memo||"";
  const dw=$("delWrap");dw.textContent="";
  if(t)dw.append(el("button",{type:"button",class:"btn d",onclick:askDelete},"削除"));
  updateLive();$("dlg").showModal();
}
function askDelete(){
  const dw=$("delWrap");dw.textContent="";
  dw.append(el("span",{class:"confirm"},"本当に削除しますか？",
    el("button",{type:"button",class:"btn-s go",onclick:async()=>{try{await removeTrack(editing.id);$("dlg").close()}catch(e){showNotice(e)}}},"削除する"),
    el("button",{type:"button",class:"btn-s",onclick:()=>openForm(editing)},"やめる")));
}
let aiOff=false;
async function aiGenre(){
  // ジャンルは DECK A の曲で判定する
  const ds=readDecks().slice(0,1).filter(d=>d.title);
  if(!ds.length)throw{message:"DECK A の曲名を入れてから判定してください"};
  const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),25000);
  let r;
  try{r=await fetch("/api/mix",{method:"POST",signal:ctrl.signal,headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"genre",pin,decks:ds,categories:catsUsed()})})}
  catch(e){throw{message:"判定の応答がありませんでした。もう一度お試しください"}}
  finally{clearTimeout(tm)}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw{message:j.error||"ジャンルを判定できませんでした"};
  return j;
}
function showCands(list){
  const box=$("cands");box.textContent="";
  (list||[]).forEach(g=>box.append(el("button",{type:"button",class:"cand","aria-pressed":String($("cat").value===g),onclick:()=>{$("cat").value=g;showCands(list)}},g)));
}
$("cat").addEventListener("input",()=>[...$("cands").children].forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===$("cat").value))));
const SRC={musicbrainz:"MusicBrainzのジャンルより",apple:"Apple Musicのジャンルより",ai:"AIの推測"};
$("aiCat").addEventListener("click",async()=>{
  const b=$("aiCat"),m=$("aiMsg");b.disabled=true;m.className="det busy";m.textContent="ジャンルを判定中…";
  try{const g=await aiGenre();$("cat").value=g.genre;m.className="det";m.textContent="判定: "+g.genre+"（"+(SRC[g.source]||"")+"）"+((g.candidates||[]).length>1?" ・ほかの候補から選ぶか、書き換えもできます":" ・書き換えもできます");showCands(g.candidates)}
  catch(e){m.className="det";m.textContent=e.message}
  finally{b.disabled=false}
});
$("form").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const data={
    decks:readDecks(),
    title:$("mT").value.trim(),category:$("cat").value.trim(),status:$("st").value,postDate:$("pd").value,
    memo:$("memo").value.trim(),
    sample:false,createdAt:editing?.createdAt||Date.now(),updatedAt:Date.now()
  };
  if(data.status==="posted"&&!data.postDate)data.postDate=todayStr();
  $("save").disabled=true;
  if(!data.category&&!aiOff&&data.decks[0]&&data.decks[0].title){
    const m=$("aiMsg");m.className="det busy";m.textContent="ジャンルを判定中…";$("save").textContent="判定中…";
    try{data.category=(await aiGenre()).genre;$("cat").value=data.category}catch(e){}
    m.className="det";m.textContent="";$("save").textContent="保存";
  }
  try{await saveTrack(editing?.id,data);$("dlg").close()}catch(e){showNotice(e)}
  $("save").disabled=false;
});
$("cancel").addEventListener("click",()=>$("dlg").close());
$("addBtn").addEventListener("click",()=>openForm(null));

/* ---------- boot ---------- */
try{tracks=JSON.parse(localStorage.getItem("ml-cache")||"[]").map(o=>({...o,status:norm(o.status)}))}catch(e){}
render();load();
setInterval(()=>{if(document.visibilityState==="visible"&&!$("dlg").open&&!$("pinDlg").open)load()},20000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")load()});
window.addEventListener("online",load);
})();
</script>
